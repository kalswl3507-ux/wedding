<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>저희 결혼합니다</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body, html { 
            margin: 0; padding: 0; min-height: 100%; width: 100%; 
            background-color: #ffffff; 
        }

        /* --- ✨ 전체 화면 슬로우 페이드 인 (4초) --- */
        .fade-in-page {
            opacity: 0;
            animation: slowFadeIn 4s ease-in-out forwards;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url('배경.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        @keyframes slowFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body { font-family: 'Noto Sans KR', sans-serif; }

        .wrapper { 
            width: 100%; 
            max-width: 520px; /* 💥 가로를 더 시원하게 넓혔습니다 */
            padding: 60px 15px; 
            position: relative; 
            z-index: 10; 
        }

        /* --- ☁️ 둥글둥글하고 넓은 컨텐츠 박스 --- */
        .content-box {
            background-color: rgba(255, 255, 255, 0.94);
            padding: 80px 40px; 
            text-align: center;
            backdrop-filter: blur(10px);
            
            /* 💥 단순 네모 방지: 모서리를 대폭 둥글게(80px) 조절 💥 */
            border-radius: 80px; 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        /* --- 📝 텍스트 스타일 --- */
        .title {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: #bbb;
            margin-bottom: 30px;
        }

        .names {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.9rem;
            color: #2c2c2c;
            margin-bottom: 40px;
        }

        .names span { font-size: 1.1rem; color: #eee; margin: 0 12px; }

        .message {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.05rem;
            line-height: 2.3;
            color: #444;
            margin-bottom: 50px;
            word-break: keep-all;
        }

        /* --- 🎀 갤러리 제목 --- */
        .gallery-header {
            margin: 40px 0 30px;
        }

        .gallery-header h3 {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 1.3rem;
            letter-spacing: 6px;
            color: #b89274;
            margin: 0;
            font-weight: 700;
        }

        /* --- 📸 갤러리 섹션 --- */
        .gallery-container { margin-bottom: 40px; }
        
        .main-photo-area {
            width: 100%; 
            height: 550px; /* 가로에 맞춰 높이도 확보 */
            border-radius: 30px; 
            overflow: hidden;
            margin-bottom: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        #mainPhoto { width: 100%; height: 100%; object-fit: cover; }

        .thumb-slider {
            display: flex; gap: 12px; overflow-x: auto;
            padding-bottom: 15px; scrollbar-width: none;
            justify-content: center; /* 썸네일 중앙 정렬 */
        }
        .thumb-slider::-webkit-scrollbar { display: none; }

        .thumb-btn {
            flex: 0 0 75px; height: 75px;
            padding: 0; border: 2px solid transparent;
            background: none; border-radius: 12px;
            overflow: hidden; cursor: pointer;
        }
        .thumb-btn.active { border-color: #b89274; }
        .thumb-btn img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; }
        .thumb-btn.active img { opacity: 1; }

        /* --- 📍 정보 및 지도 섹션 --- */
        .info { border-top: 1px solid #f5f5f5; padding-top: 50px; margin-top: 30px; }
        .date { font-family: 'Nanum Myeongjo', serif; font-size: 1.15rem; font-weight: bold; color: #b89274; margin-bottom: 12px; }
        .location { font-size: 1rem; color: #333; margin-bottom: 8px; }
        .address { font-size: 0.85rem; color: #999; margin-bottom: 30px; }

        .map-link {
            display: inline-block;
            text-decoration: none;
        }
        .map-icon-circle {
            width: 60px; height: 60px;
            background-color: #fff;
            border: 1px solid #f2e4d8;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 5px 15px rgba(184, 146, 116, 0.15);
        }
    </style>
</head>
<body>

    <div class="fade-in-page">
        <div class="wrapper">
            <div class="content-box">
                <div class="title">INVITATION</div>
                <div class="names">김신랑 <span>|</span> 이신부</div>
                
                <div class="message">
                    서로가 마주 보며 다진 약속이<br>
                    결실을 맺는 소중한 날입니다.<br><br>
                    함께 오셔서 축복해 주시면<br>
                    더없는 기쁨으로 간직하겠습니다.
                </div>

                <div class="gallery-header">
                    <h3>GALLERY</h3>
                </div>

                <div class="gallery-container">
                    <div class="main-photo-area">
                        <img src="gallery/사진1.jpg" id="mainPhoto">
                    </div>
                    <div class="thumb-slider">
                        <button class="thumb-btn active" onclick="updateGallery('gallery/사진1.jpg', this)"><img src="gallery/사진1.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진2.jpg', this)"><img src="gallery/사진2.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진3.jpg', this)"><img src="gallery/사진3.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진4.jpg', this)"><img src="gallery/사진4.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진5.jpg', this)"><img src="gallery/사진5.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진6.jpg', this)"><img src="gallery/사진6.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진7.jpg', this)"><img src="gallery/사진7.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진8.jpg', this)"><img src="gallery/사진8.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진9.jpg', this)"><img src="gallery/사진9.jpg"></button>
                        <button class="thumb-btn" onclick="updateGallery('gallery/사진10.jpg', this)"><img src="gallery/사진10.jpg"></button>
                    </div>
                </div>

                <div class="info">
                    <div class="date">2026년 5월 23일 토요일 오후 1시</div>
                    <div class="location">라마다신도림호텔웨딩 그랜드볼룸</div>
                    <div class="address">서울특별시 구로구 신도림동 420-10</div>

                    <a href="https://map.naver.com/v5/search/라마다신도림호텔웨딩" target="_blank" class="map-link">
                        <div class="map-icon-circle">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#b89274" stroke-width="1.5">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                        </div>
                        <span style="color: #b89274; font-size: 0.9rem; font-weight: bold;">네이버 지도 보기</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateGallery(imgSrc, element) {
            document.getElementById('mainPhoto').src = imgSrc;
            var btns = document.getElementsByClassName('thumb-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            element.classList.add('active');
        }
    </script>
</body>
</html>
