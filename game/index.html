<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#152c45">
  <title>CHAE NA ♥ HO JIN — Wedding Adventure</title>
  <link rel="stylesheet" href="style.css?v=supplied-ui-5">
  <script defer src="engine.js"></script>
  <script defer src="pixel.js"></script>
  <script defer src="art.js?v=supplied-ui-5"></script>
  <script defer src="game.js?v=supplied-ui-5"></script>
</head>
<body>
  <main class="invitation">

    <section class="game-shell" aria-label="웨딩 어드벤처 게임">
      <div class="game-frame" id="gameFrame">
        <canvas id="game" width="960" height="540" tabindex="0" aria-label="신랑의 웨딩 모험. 화면 터치 또는 스페이스 키로 점프합니다.">캔버스를 지원하는 브라우저에서 게임을 열어주세요.</canvas>
        <div class="screen-overlay" id="startScreen">
          <div class="start-card"><button id="startButton" type="button" aria-label="게임 시작"><svg viewBox="0 150 1086 1140" aria-hidden="true"><image href="png/start.png" width="1086" height="1448"/></svg></button></div>
        </div>
        <div class="end-controls" id="endScreen" hidden><button id="restartButton" type="button">PLAY AGAIN ↻</button></div>
      </div>
      <div class="game-toolbar"><p id="instruction">화면을 톡! 누르면 점프해요</p><button id="muteButton" type="button" aria-label="소리 켜기" aria-pressed="true">SOUND OFF</button></div>
    </section>

    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
